name: "PHPUnit Tests"

on:
  push:
    branches-ignore:
      - "release/**"
    paths:
      - "**.php"
      - ".github/workflows/ci-phpunit.yml"
      - "phpunit.xml"
      - "tests/**"
  pull_request:
    paths:
      - "**.php"
      - ".github/workflows/ci-phpunit.yml"
      - "phpunit.xml"
      - "tests/**"
  workflow_dispatch:

env:
  COMPOSER_FLAGS: '--prefer-dist --no-progress --no-interaction'

jobs:
  check-changes:
    name: "Check Changed Files"
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      should_run_all: ${{ steps.check.outputs.should_run_all }}
      affected_tests: ${{ steps.identify.outputs.affected_tests }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v41
        with:
          files_separator: ","

      - name: Determine run scope
        id: check
        run: |
          CHANGED="${{ steps.changed-files.outputs.all_changed_files }}"
          SHOULD_RUN_ALL=false
          SHOULD_RUN=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || \
             [[ "$CHANGED" == *"phpunit.xml"* ]] || \
             [[ "$CHANGED" == *"ci-phpunit.yml"* ]]; then
            SHOULD_RUN_ALL=true
            SHOULD_RUN=true
            echo "Config change or manual trigger — running full suite."
          fi

          for file in $(echo "$CHANGED" | tr ',' '\n'); do
            [[ "$file" == *.php ]] && SHOULD_RUN=true && break
          done

          echo "should_run_all=$SHOULD_RUN_ALL" >> $GITHUB_OUTPUT
          echo "should_run=$SHOULD_RUN" >> $GITHUB_OUTPUT

      - name: Identify affected tests
        id: identify
        if: >
          steps.check.outputs.should_run == 'true' &&
          steps.check.outputs.should_run_all != 'true'
        run: |
          CHANGED="${{ steps.changed-files.outputs.all_changed_files }}"
          TESTS=""

          for file in $(echo "$CHANGED" | tr ',' '\n'); do
            # Directly changed test files
            if [[ "$file" == tests/*Test.php || "$file" == tests/*/Tests*.php ]]; then
              TESTS="${TESTS:+$TESTS,}$file"
              continue
            fi
            # Find test file matching a changed src file
            if [[ "$file" == src/*.php || "$file" == src/**/*.php ]]; then
              BASE=$(basename "$file" .php)
              MATCH=$(find tests -name "${BASE}Test.php" 2>/dev/null | head -1)
              [ -n "$MATCH" ] && TESTS="${TESTS:+$TESTS,}$MATCH"
            fi
          done

          echo "affected_tests=$TESTS" >> $GITHUB_OUTPUT
          if [ -n "$TESTS" ]; then
            echo "Targeting tests:"; echo "$TESTS" | tr ',' '\n'
          else
            echo "No specific test mapping — full suite will run."
          fi

  phpunit:
    name: "PHP ${{ matrix.php }}"
    runs-on: ubuntu-latest
    needs: check-changes
    if: ${{ needs.check-changes.outputs.should_run == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.2']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, json, tokenizer
          coverage: pcov
          tools: composer
          ini-values: memory_limit=512M
        env:
          debug: false

      - name: Check if running with act
        id: is-act
        run: |
          if [ -n "$ACT" ]; then echo "is_act=true" >> $GITHUB_OUTPUT
          else echo "is_act=false" >> $GITHUB_OUTPUT; fi

      - name: Get Composer cache directory
        id: composer-cache
        if: steps.is-act.outputs.is_act != 'true'
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        if: steps.is-act.outputs.is_act != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php }}-composer-

      - name: Install Composer dependencies
        run: |
          composer config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer install ${{ env.COMPOSER_FLAGS }}

      - name: Build test filter
        id: filter
        run: |
          if [[ "${{ needs.check-changes.outputs.should_run_all }}" == "true" ]] || \
             [[ -z "${{ needs.check-changes.outputs.affected_tests }}" ]]; then
            echo "args=" >> $GITHUB_OUTPUT
            echo "Running full test suite."
          else
            IFS=',' read -ra FILES <<< "${{ needs.check-changes.outputs.affected_tests }}"
            echo "args=${FILES[*]}" >> $GITHUB_OUTPUT
            echo "Running targeted tests: ${FILES[*]}"
          fi

      - name: Run PHPUnit
        run: |
          if [ -n "${{ steps.filter.outputs.args }}" ]; then
            vendor/bin/phpunit --testdox ${{ steps.filter.outputs.args }} \
              | tee phpunit-output.txt
          else
            vendor/bin/phpunit --testdox --coverage-clover=coverage.xml \
              | tee phpunit-output.txt
          fi

      - name: Upload coverage (PHP 8.2 only)
        if: ${{ !env.ACT && success() && matrix.php == '8.2' && needs.check-changes.outputs.should_run_all == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-php${{ matrix.php }}
          path: coverage.xml
          retention-days: 7

      - name: Upload test output
        if: ${{ !env.ACT && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-results-php${{ matrix.php }}
          path: phpunit-output.txt
          retention-days: 5

      - name: Step summary
        if: always()
        run: |
          {
            echo "## PHPUnit — PHP ${{ matrix.php }}"
            if [ -f phpunit-output.txt ]; then
              # Extract pass/fail/skip counts from PHPUnit output
              SUMMARY=$(grep -E '^(OK|FAILURES|Tests:)' phpunit-output.txt | tail -1 || echo "")
              if [ -n "$SUMMARY" ]; then
                echo '```'
                echo "$SUMMARY"
                echo '```'
              fi
              if grep -q "FAILURES" phpunit-output.txt; then
                echo "❌ **Test failures — see output artifact.**"
              else
                echo "✅ **All tests passed.**"
              fi
            else
              echo "❌ No test output captured."
            fi

            SCOPE="${{ needs.check-changes.outputs.should_run_all }}"
            TARGETS="${{ needs.check-changes.outputs.affected_tests }}"
            echo ""
            echo "### Scope"
            if [ "$SCOPE" == "true" ] || [ -z "$TARGETS" ]; then
              echo "Full test suite executed."
            else
              echo "Targeted tests:"
              echo '```'
              echo "$TARGETS" | tr ',' '\n'
              echo '```'
            fi

            echo ""
            echo "### Workflow Structure"
            echo '```'
            echo "📊 Job Status Tree:"
            echo "├── check-changes"
            echo "└── phpunit (7.4 / 8.1 / 8.2)"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
